version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ferretrack
      POSTGRES_PASSWORD: ferretrack
      POSTGRES_DB: ferretrack
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferretrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
